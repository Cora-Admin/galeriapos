name: Deploy POS Cockpit (EC2, stillgelegt)

# STILLGELEGT – das Hosting läuft auf Vercel (siehe DEPLOYMENT.md).
# Vercel baut und veröffentlicht bei jedem Push auf main automatisch.
#
# Dieser Workflow bleibt nur als Rückfallebene erhalten, falls kurzfristig
# wieder auf die EC2 ausgeliefert werden muss. Er startet deshalb NICHT mehr
# automatisch, sondern ausschließlich manuell über den "Run workflow"-Button.
#
# Achtung beim manuellen Start: Der Schritt "Auf der EC2 veröffentlichen"
# kopiert deploy/nginx-pos-cockpit.conf über die Config auf dem Server. Diese
# Config lauscht nur auf Port 80 – ein dort per certbot eingerichteter
# TLS-Block würde dabei überschrieben.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktions-Build erstellen
        env:
          # Supabase-Werte kommen aus den GitHub-Secrets und werden
          # zur Build-Zeit in die App eingebacken.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: dist/ und nginx-Config auf die EC2 übertragen
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*,deploy/nginx-pos-cockpit.conf"
          target: "/tmp/pos-cockpit-deploy"
          rm: true

      - name: Auf der EC2 veröffentlichen
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 1) Statische App-Dateien veröffentlichen
            sudo mkdir -p /var/www/pos-cockpit
            sudo rm -rf /var/www/pos-cockpit/*
            sudo cp -r /tmp/pos-cockpit-deploy/dist/* /var/www/pos-cockpit/
            sudo chown -R www-data:www-data /var/www/pos-cockpit

            # 2) nginx-Config aus dem Repo ausrollen und aktivieren.
            #    Nur mit cp (per NOPASSWD-sudo erlaubt) – kein mv/ln nötig.
            #    Direkt nach sites-enabled kopieren = aktiviert, ohne Symlink.
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            sudo cp /tmp/pos-cockpit-deploy/deploy/nginx-pos-cockpit.conf /etc/nginx/sites-available/pos-cockpit
            sudo cp /tmp/pos-cockpit-deploy/deploy/nginx-pos-cockpit.conf /etc/nginx/sites-enabled/pos-cockpit

            # 3) Aufräumen und nginx neu laden. reload ist graceful:
            #    bei fehlerhafter Config bleibt die alte aktiv.
            rm -rf /tmp/pos-cockpit-deploy
            sudo systemctl reload nginx
